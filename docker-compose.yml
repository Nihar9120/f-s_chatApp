version: '3.8'
services:
 mongodb:
  image: mongo:7.0
  container_name: full-stack_mongodb
  restart: unless-stopped
  volumes:
    - mongo-data:/data/db
  environment:
    MONGO_INITDB_ROOT_USERNAME: mongoadmin
    MONGO_INITDB_ROOT_PASSWORD: secret
  ports:
    - "27017:27017"
  networks:
    - fullstack-chatapp

 backend:
  build:
    context: ./backend
  container_name: full-stack_backend
  environment:
    - NODE_ENV=production
    - COOKIE_SECURE=false
    - MONGODB_URI=mongodb://mongoadmin:secret@mongodb:27017/dbname?authSource=admin
    - JWT_SECRET=eyJhbGciOiJIUzI1NiJ9.eyJSb2xlIjoiQWRtaW4iLCJJc3N1ZXIiOiJJc3N1ZXIiLCJVc2VybmFtZSI6IkphdmFJblVzZSIsImV4cCI6MTc5MzMxOTE1MiwiaWF0IjoxNzkwNzI3MTUyfQ.S1WLXouT6B_bETz1A1KaL-aQ9ylB5T9xXN3mP3XDxEA
    - PORT=5001
  depends_on:
    - mongodb
  networks:
    - fullstack-chatapp

frontend:
  build:
    context: ./frontend
  container_name: full-stack_frontend
  ports:
    - "80:80"
  depends_on:
    - backend
  networks:
    - fullstack-chatapp

networks:
  fullstack-chatapp:
    driver: bridge

volumes:
  mongo-data:

